ext {
    // Every Capacitor plugin reads rootProject.ext.kotlin_version and otherwise
    // falls back to its own default. Without this, @capacitor/camera compiled
    // its Kotlin 2.2 sources with whatever the root classpath happened to be,
    // and failed with "Cannot access 'CAMERA': it is private in 'Companion'".
    kotlin_version = '2.2.20'
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}